<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yakusoku — Live Firewall Dashboard</title>
  <link rel="stylesheet" href="/dashboard.css" />
</head>
<body>
  <header>
    <h1>Yakusoku <span class="tagline">— pre-signature firewall for AI agent payments</span></h1>
    <div id="conn-status" class="status status-connecting">connecting…</div>
  </header>

  <section id="intents-section">
    <h2>Active intents</h2>
    <div id="intents-list" class="intents-list">
      <p class="muted">Loading…</p>
    </div>
  </section>

  <main>
    <section id="timeline-section">
      <div class="lane-headers">
        <div class="lane-header lane-header-left">Without Yakusoku (naive agent wallet)</div>
        <div class="lane-header lane-header-right">With Yakusoku (firewall verdict)</div>
      </div>
      <div id="rows" class="rows">
        <p class="muted">Loading…</p>
      </div>
    </section>

    <aside id="detail-panel">
      <div id="detail-empty" class="muted">Click a row to see the decision detail.</div>
      <div id="detail-content" hidden></div>
    </aside>
  </main>

  <script src="/dashboard.js"></script>
</body>
</html>
